# OrkaOS: wipe the console framebuffer (/dev/fb0) to black before the login
# screen starts. Nothing is ever printed on the console (fbcon defers its
# take-over until then), so fb0 kept the boot screen's last frame (Plymouth
# draws there after amdgpu replaces simpledrm). The kernel shows fb0 whenever
# no program owns the screen: between the login screen and Hyprland the
# logo and ripples flashed for a moment (orka r65 on the PC, 2026-11-10;
# seen by reading /dev/fb0). Black matches the login screen's fade to black.
# greetd starts after Plymouth has quit (plymouth.conf), so nothing draws
# there again. No fb0 (another GPU driver): nothing to do.
[Service]
ExecStartPre=-/bin/sh -c 'if [ -w /dev/fb0 ]; then cat /dev/zero >/dev/fb0 2>/dev/null; fi; exit 0'
