# OrkaOS: "online" once any one link (Ethernet or Wi-Fi) is up, not every
# link, and give up after 10 s. Both .network files say
# RequiredForOnline=routable, so by default an unused Ethernet port or Wi-Fi
# held network-online.target (and Docker, and graphical.target, which uwsm
# waits for before starting Hyprland) for the full 2-minute timeout.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=10
