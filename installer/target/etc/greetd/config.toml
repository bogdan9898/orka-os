# OrkaOS login screen: greetd runs orka-greeter (the Quickshell greeter,
# shell/greeter.qml, inside the cage kiosk compositor; its log goes to the
# journal: journalctl -t orka-greeter) as the "greeter" user. After a login
# the greeter starts Hyprland through orka-session (uwsm).
[terminal]
vt = 1

[default_session]
command = "orka-greeter"
user = "greeter"
