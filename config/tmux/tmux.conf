# OrkaOS tmux defaults (from Omarchy v3.8.4, MIT), sourced by
# ~/.config/tmux/tmux.conf. Replaced on updates; put your own settings in
# that file after the source-file line.

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send the prefix key" C-Space send-prefix

# Every binding has a note (-N): the OrkaOS cheat sheet (SUPER + K) lists
# them with `tmux list-keys -N`. Give your own bindings one too.

# Reload config
bind -N "Reload the tmux config" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi -N "Start selection" v send -X begin-selection
bind -T copy-mode-vi -N "Copy selection" y send -X copy-selection-and-cancel

# Pane Controls
bind -n -N "Split pane below" M-Enter split-window -v -c "#{pane_current_path}"
bind -n -N "Split pane to the right" M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n -N "Close pane" M-Escape kill-pane

bind -N "Split pane below" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane to the right" v split-window -h -c "#{pane_current_path}"
bind -N "Close pane" x kill-pane

bind -n -N "Focus pane left" C-M-Left select-pane -L
bind -n -N "Focus pane right" C-M-Right select-pane -R
bind -n -N "Focus pane up" C-M-Up select-pane -U
bind -n -N "Focus pane down" C-M-Down select-pane -D

bind -n -N "Resize pane left" C-M-S-Left resize-pane -L 5
bind -n -N "Resize pane down" C-M-S-Down resize-pane -D 5
bind -n -N "Resize pane up" C-M-S-Up resize-pane -U 5
bind -n -N "Resize pane right" C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -N "Close window" k kill-window

bind -n -N "Go to window 1" M-1 select-window -t 1
bind -n -N "Go to window 2" M-2 select-window -t 2
bind -n -N "Go to window 3" M-3 select-window -t 3
bind -n -N "Go to window 4" M-4 select-window -t 4
bind -n -N "Go to window 5" M-5 select-window -t 5
bind -n -N "Go to window 6" M-6 select-window -t 6
bind -n -N "Go to window 7" M-7 select-window -t 7
bind -n -N "Go to window 8" M-8 select-window -t 8
bind -n -N "Go to window 9" M-9 select-window -t 9

bind -n -N "Previous window" M-Left select-window -t -1
bind -n -N "Next window" M-Right select-window -t +1
bind -n -N "Move window left" M-S-Left swap-window -t -1 \; select-window -t -1
bind -n -N "Move window right" M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "New session" C new-session -c "#{pane_current_path}"
bind -N "Close session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -n -N "Previous session" M-Up switch-client -p
bind -n -N "Next session" M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
