# OrkaOS: hypridle only makes sure the screen is locked before the machine
# sleeps. Locking and turning the screen off on idle are done by the OrkaOS
# shell, with the times in ~/.config/orka/settings.json.
general {
    lock_cmd = orka-lock                     # loginctl lock-session runs this
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3                        # wait until the session is locked
}
