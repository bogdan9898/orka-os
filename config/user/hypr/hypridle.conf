# OrkaOS idle behavior (hypridle). No lock screen yet: the Quickshell lock
# screen comes later; until then the screen only turns off.
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Turn the screen off after 10 minutes.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
